<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Médicos</title>
  <link rel="stylesheet" href="/assets/css/styles.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../assets/css/sidebar-modern.css">
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
</head>

<body>
  <div id="aplicacion">
    <div class="page-content" id="contenido_pagina">
      <main>
        <h1>Médicos</h1>
        <!-- Mensajes -->
        <div id="mensajes_medicos">
          <script>
            const p = new URLSearchParams(window.location.search);
            const exito = p.get('exito');
            const error = p.get('error');
            if (exito) { document.write('<div class="alert alert-success">' + decodeURIComponent(exito) + '</div>'); }
            if (error) { document.write('<div class="alert alert-danger">' + decodeURIComponent(error) + '</div>'); }
          </script>
        </div>


        <!-- Formulario para crear médico  -->
        <div id="form_area_medico" style="max-width:700px; margin-bottom:12px;">
          <form id="form_fallback_medico" method="post" action="../controllers/medicos.php">
            <input type="hidden" name="accion" value="crear" id="medico_accion">
            <input type="hidden" name="id" id="medico_id" value="">
            <div class="mb-2">
              <label>Nombre</label>
              <input id="medico_nombre" name="nombre" class="form-control" required>
            </div>
            <div class="mb-2">
              <label>Especialidad</label>
              <select id="medico_especialidad" name="especialidad" class="form-control">
                <option value="">Cargando...</option>
              </select>
            </div>
            <div class="mb-2">
              <label>Horario</label>
              <input id="medico_horario" name="horario" class="form-control" placeholder="Ej: Lun-Vie 09:00-14:00">
            </div>
            <div class="mb-2">
              <label>Email</label>
              <input id="medico_email" type="email" name="email" class="form-control" placeholder="ejemplo@dominio.com">
            </div>
            <div class="mb-2">
              <label>Teléfono</label>
              <input id="medico_telefono" type="tel" name="telefono" class="form-control" placeholder="(opcional)">
            </div>
            <div class="mb-2">
              <label>Cédula profesional</label>
              <input id="medico_cedula_profesional" name="cedula_profesional" class="form-control"
                placeholder="(opcional)">
            </div>
            <div class="mb-2" style="display:flex; align-items:center; gap:8px;">
              <input type="checkbox" id="medico_activo" name="activo" value="1" checked>
              <label for="medico_activo" style="margin:0;">Activo</label>
            </div>
            <div style="text-align:right;"><button type="submit" class="btn-registrar-medico">Agregar</button></div>
          </form>
        </div>

        <div class="card shadow-sm" style="padding:14px;">
          <div class="table-responsive">
            <table id="medicosTable" class="simple-table" style="width:100%">
              <thead>
                <tr>
                  <th>Médico</th>
                  <th>Especialidad</th>
                  <th>Horario</th>
                  <th>Acciones</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
      </main>
    </div>
  </div>


  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/load-sidebar.js"></script>
  <script src="../assets/js/medicos.js?v=20251117.2"></script>
</body>

</html>
