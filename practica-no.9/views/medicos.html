<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Médicos</title>
  <link rel="stylesheet" href="../assets/css/styles.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../assets/css/sidebar-modern.css">
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
</head>

<body>
  <div id="aplicacion">
    <div class="page-content" id="contenido_pagina">
      <main>
        <h1>Médicos</h1>
        <!-- Mensajes -->
        <div id="mensajes_medicos">
          <script>
            const p = new URLSearchParams(window.location.search);
            const exito = p.get('exito');
            const error = p.get('error');
            if (exito) { document.write('<div class="alert alert-success">' + decodeURIComponent(exito) + '</div>'); }
            if (error) { document.write('<div class="alert alert-danger">' + decodeURIComponent(error) + '</div>'); }
          </script>
        </div>


        <!-- Formulario para crear médico  -->
        <div id="form_area_medico" style="max-width:700px; margin-bottom:12px;">
          <form id="form_fallback_medico" method="post" action="../controllers/medicos.php">
            <input type="hidden" name="accion" value="crear" id="medico_accion">
            <input type="hidden" name="id" id="medico_id" value="">
            <div class="mb-2">
              <label>Nombre</label>
              <input id="medico_nombre" name="nombre" class="form-control" required>
            </div>
            <div class="mb-2">
              <label>Especialidad</label>
              <select id="medico_especialidad" name="especialidad" class="form-control">
                <option value="">Cargando...</option>
              </select>
            </div>
            <div class="row">
              <div class="col-md-6 mb-2">
                <label>Hora Inicio</label>
                <input id="medico_hora_inicio" type="time" name="hora_inicio" class="form-control" min="07:00"
                  max="17:00">
                <small class="text-muted">Horario: 7:00 AM - 5:00 PM</small>
              </div>
              <div class="col-md-6 mb-2">
                <label>Hora Fin</label>
                <input id="medico_hora_fin" type="time" name="hora_fin" class="form-control" min="07:00" max="17:00">
                <small class="text-muted">Horario: 7:00 AM - 5:00 PM</small>
              </div>
            </div>
            <div class="mb-2">
              <label>Gmail(personal)</label>
              <input id="medico_email" type="email" name="email" class="form-control"
                placeholder="muerteamerica@gmail.com">
            </div>
            <div class="mb-2">
              <label>Teléfono</label>
              <input id="medico_telefono" type="tel" name="telefono" class="form-control" placeholder="(opcional)">
            </div>
            <div class="mb-2">
              <label>Cédula profesional</label>
              <input id="medico_cedula_profesional" name="cedula_profesional" class="form-control"
                placeholder="(opcional)">
            </div>
            <div class="mb-2" style="display:flex; align-items:center; gap:8px;">
              <input type="checkbox" id="medico_activo" name="activo" value="1" checked>
              <label for="medico_activo" style="margin:0;">Activo</label>
            </div>
            <div style="text-align:right;"><button type="submit" class="btn-registrar-medico">Agregar</button></div>
          </form>
        </div>

        <div class="card shadow-sm" style="padding:14px;">
          <div class="table-responsive">
            <table id="medicosTable" class="simple-table" style="width:100%">
              <thead>
                <tr>
                  <th>Médico</th>
                  <th>Especialidad</th>
                  <th>Horario</th>
                  <th>Acciones</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
      </main>
    </div>
  </div>

  <!-- Modal Confirmación Cerrar Sesión -->
  <div id="modal_logout" class="modal-modern">
    <div class="modal-overlay"></div>
    <div class="modal-container modal-small">
      <div class="modal-header">
        <i class="bi bi-box-arrow-right"></i>
        <h3>Cerrar Sesión</h3>
        <button class="modal-close" data-modal-close>
          <i class="bi bi-x-lg"></i>
        </button>
      </div>
      <div class="modal-body">
        <p>¿Estás seguro que deseas cerrar sesión?</p>
        <p style="font-size: 13px; color: #888;">Tendrás que volver a iniciar sesión para acceder al sistema.</p>
      </div>
      <div class="modal-footer">
        <button class="btn-modal-secondary" data-modal-close>Cancelar</button>
        <button id="boton_cerrar_sesion" class="btn-modal-danger" onclick="cerrar_sesion(); return false;">
          <i class="bi bi-box-arrow-right"></i> Cerrar Sesión
        </button>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/modal-handler.js"></script>
  <script src="../assets/js/load-sidebar.js"></script>
  <script src="../assets/js/medicos.js?v=20251117.2"></script>
  <script src="../assets/js/auth-guard.js"></script>
  <!-- Modal Exito Bootstrap -->
  <div class="modal fade" id="modal_exito_medico" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header bg-success text-white">
          <h5 class="modal-title">Acción registrada</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body text-center">
          <i class="bi bi-check-circle-fill text-success" style="font-size: 3rem;"></i>
          <p class="mt-3 fs-5">Médico guardado correctamente</p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
