<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bitácoras de Usuarios</title>
  <link rel="stylesheet" href="../assets/css/styles.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      padding: 20px
    }
  </style>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../assets/css/sidebar-modern.css">
</head>

<body>
  <div class="top-bar">
    La vida es la Prioridad ante todo
  </div>
  <div id="aplicacion">
    <!-- Contenido principal -->
    <div class="page-content" id="contenido_pagina">


      <h1>Bitácoras de Usuarios</h1>
      <p>Listado de acciones de usuarios</p>

      <div class="card mt-3">
        <div class="card-body">
          <div class="table-responsive">
            <table id="tabla_bitacoras" class="table table-striped table-sm">
              <thead>
                <tr>
                  <th>Usuario</th>
                  <th>Rol</th>
                  <th>Fecha</th>
                  <th>Accion</th>
                  <th>Modulo</th>
                </tr>
              </thead>
              <tbody>
                <!-- filas dinamicas -->
              </tbody>
            </table>
          </div>
        </div>
      </div>

    </div>
  </div><!-- /page-content -->
  </div>
  <!-- Modal Confirmación Cerrar Sesión -->
  <div id="modal_logout" class="modal-modern">
    <div class="modal-overlay"></div>
    <div class="modal-container modal-small">
      <div class="modal-header">
        <i class="bi bi-box-arrow-right"></i>
        <h3>Cerrar Sesión</h3>
        <button class="modal-close" data-modal-close>
          <i class="bi bi-x-lg"></i>
        </button>
      </div>
      <div class="modal-body">
        <p>¿Estás seguro que deseas cerrar sesión?</p>
        <p style="font-size: 13px; color: #888;">Tendrás que volver a iniciar sesión para acceder al sistema.</p>
      </div>
      <div class="modal-footer">
        <button class="btn-modal-secondary" data-modal-close>Cancelar</button>
        <button id="boton_cerrar_sesion" class="btn-modal-danger">
          <i class="bi bi-box-arrow-right"></i> Cerrar Sesión
        </button>
      </div>
    </div>
  </div>
  <script src="../assets/js/modal-handler.js"></script>
  <script src="../assets/js/global-modals.js"></script>
  <script src="../assets/js/bitacoras.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/load-sidebar.js"></script>
</body>

</html>
