<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reportes</title>
  <link rel="stylesheet" href="../assets/css/styles.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      padding: 20px
    }
  </style>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../assets/css/sidebar-modern.css">
</head>

<body>
  <div class="top-bar">
    La vida es la Prioridad ante todo
  </div>
  <div id="aplicacion">



    <!-- Contenido principal -->
    <div class="page-content" id="contenido_pagina">
      <h1>Reportes - Resumen</h1>
      <div class="card mb-3 shadow-sm">
        <div class="card-body d-flex gap-3 flex-wrap align-items-center">
          <div class="p-2 bg-light rounded" style="min-width:160px">
            <div>Total ingresos</div>
            <div id="kpi_ingresos" style="font-weight:800; font-size:18px">$0.00</div>
          </div>
          <div class="p-2 bg-light rounded" style="min-width:160px">
            <div>Citas en rango</div>
            <div id="kpi_citas" style="font-weight:800; font-size:18px">0</div>
          </div>
          <div class="p-2 bg-light rounded" style="min-width:160px">
            <div>Pacientes nuevos</div>
            <div id="kpi_pacientes" style="font-weight:800; font-size:18px">0</div>
          </div>
          <div class="ms-auto">
            <button id="btn_export" class="btn-registrar-medico">Exportar</button>
          </div>
        </div>
      </div>

      <div class="card shadow-sm">
        <div class="card-body">
          <h5>Transacciones</h5>
          <div class="table-responsive">
            <table class="simple-table" id="tabla_reportes">
              <thead>
                <tr>
                  <th>Fecha</th>
                  <th>Paciente</th>
                  <th>Medico</th>
                  <th>Servicio</th>
                  <th>Monto</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </div>


    </div>
  </div>
  <!-- Modal Confirmación Cerrar Sesión -->
  <div id="modal_logout" class="modal-modern">
    <div class="modal-overlay"></div>
    <div class="modal-container modal-small">
      <div class="modal-header">
        <i class="bi bi-box-arrow-right"></i>
        <h3>Cerrar Sesión</h3>
        <button class="modal-close" data-modal-close>
          <i class="bi bi-x-lg"></i>
        </button>
      </div>
      <div class="modal-body">
        <p>¿Estás seguro que deseas cerrar sesión?</p>
        <p style="font-size: 13px; color: #888;">Tendrás que volver a iniciar sesión para acceder al sistema.</p>
      </div>
      <div class="modal-footer">
        <button class="btn-modal-secondary" data-modal-close>Cancelar</button>
        <button id="boton_cerrar_sesion" class="btn-modal-danger" onclick="cerrar_sesion(); return false;">
          <i class="bi bi-box-arrow-right"></i> Cerrar Sesión
        </button>
      </div>
    </div>
  </div>
  <script src="../assets/js/reportes.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/modal-handler.js"></script>
  <script src="../assets/js/load-sidebar.js"></script>
  <script src="../assets/js/auth-guard.js"></script>
</body>

</html>
