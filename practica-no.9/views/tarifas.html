<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestor de Tarifas</title>
  <link rel="stylesheet" href="../assets/css/styles.css">
  <style>
    body {
      padding: 20px
    }
  </style>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../assets/css/sidebar-modern.css">
</head>

<body>
  <div class="top-bar">
    La vida es la Prioridad ante todo
  </div>
  <div id="aplicacion">
    <!-- Contenido principal -->
    <div class="page-content" id="contenido_pagina">


      <h1>Gestor de Tarifas</h1>
      <p>Editar tarifas de consulta y servicios</p>
      <div class="card shadow-sm" style="max-width:1100px;">
        <div class="card-body">
          <div class="d-flex align-items-center justify-content-between mb-3 gap-3">
            <div>
              <button id="btn_nueva_tarifa" class="btn-registrar-medico">Registrar servicio</button>
            </div>
            <div class="ms-auto" style="min-width:260px;">
              <input id="buscar_tarifas" class="form-control form-control-sm" placeholder="Buscar tarifa o servicio">
            </div>
          </div>
          <div id="tabla_container" class="table-responsive">
            <table id="tabla_tarifas" class="simple-table">
              <thead>
                <tr>
                  <th>Especialidad</th>
                  <th>Servicio</th>
                  <th>Precio</th>
                  <th style="width:140px">Acciones</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </div>

    </div>

    <!-- Modal registrar/editar tarifa -->
    <div class="modal fade" id="modal_tarifa" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <form id="form_tarifa">
            <div class="modal-header">
              <h5 class="modal-title">Registrar tarifa</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <div class="modal-body">
              <input type="hidden" id="tarifa_id">
              <div class="mb-2">
                <label class="form-label">Especialidad</label>
                <input id="tarifa_especialidad" class="form-control" required>
              </div>
              <div class="mb-2">
                <label class="form-label">Servicio</label>
                <input id="tarifa_servicio" class="form-control" required>
              </div>
              <div class="mb-2">
                <label class="form-label">Precio</label>
                <input id="tarifa_precio" class="form-control" type="number" step="0.01" required>
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
              <button type="submit" class="btn btn-primary">Guardar</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
  </div>
  <!-- Modal Confirmación Cerrar Sesión -->
  <div id="modal_logout" class="modal-modern">
    <div class="modal-overlay"></div>
    <div class="modal-container modal-small">
      <div class="modal-header">
        <i class="bi bi-box-arrow-right"></i>
        <h3>Cerrar Sesión</h3>
        <button class="modal-close" data-modal-close>
          <i class="bi bi-x-lg"></i>
        </button>
      </div>
      <div class="modal-body">
        <p>¿Estás seguro que deseas cerrar sesión?</p>
        <p style="font-size: 13px; color: #888;">Tendrás que volver a iniciar sesión para acceder al sistema.</p>
      </div>
      <div class="modal-footer">
        <button class="btn-modal-secondary" data-modal-close>Cancelar</button>
        <button id="boton_cerrar_sesion" class="btn-modal-danger">
          <i class="bi bi-box-arrow-right"></i> Cerrar Sesión
        </button>
      </div>
    </div>
  </div>
  <script src="../assets/js/modal-handler.js"></script>
  <script src="../assets/js/global-modals.js"></script>
  <!-- Bootstrap bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/tarifas.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/load-sidebar.js"></script>
  <script src="../assets/js/auth-guard.js"></script>
</body>

</html>
