<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Especialidades Médicas</title>
  <link rel="stylesheet" href="../assets/css/styles.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      padding: 20px
    }
  </style>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../assets/css/sidebar-modern.css">
</head>

<body>
  <div class="top-bar">
    La vida es la Prioridad ante todo
  </div>
  <div id="aplicacion">
    <!-- Contenido principal -->
    <div class="page-content" id="contenido_pagina">


      <h1>Especialidades Médicas</h1>
      <p>Lista y gestión de especialidades.</p>
      <!-- Mensajes-->
      <div id="mensajes">
        <script>
          const params = new URLSearchParams(window.location.search);
          const exito = params.get('exito');
          const error = params.get('error');
          if (exito) { document.write('<div class="alert alert-success">' + decodeURIComponent(exito) + '</div>'); }
          if (error) { document.write('<div class="alert alert-danger">' + decodeURIComponent(error) + '</div>'); }
        </script>
      </div>

      <!-- Formulario para crear especialidad -->
      <div style="max-width:600px; margin-bottom:12px;">
        <form id="form_especialidad" method="post" action="../controllers/especialidades.php">
          <input type="hidden" name="accion" value="crear" id="especialidad_accion">
          <input type="hidden" name="id" id="especialidad_id" value="">
          <div class="mb-2">
            <label>Nombre</label>
            <input id="especialidad_nombre" name="nombre" class="form-control" required />
          </div>
          <div class="mb-2">
            <label>Descripción</label>
            <textarea id="especialidad_descripcion" name="descripcion" class="form-control"></textarea>
          </div>
          <div style="text-align:right; margin-top:8px;">
            <button type="submit" class="btn-agregar-especialidad">Agregar</button>
          </div>
        </form>
      </div>

      <div class="card">
        <div class="card-body">
          <table id="tabla_especialidades" class="table table-striped table-bordered" style="width:100%">
            <thead>
              <tr>
                <th>Especialidad</th>
                <th>Descripción</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>



    </div>
    </div><!-- /page-content -->
  </div>
  <!-- Modal Confirmación Cerrar Sesión -->
  <div id="modal_logout" class="modal-modern">
    <div class="modal-overlay"></div>
    <div class="modal-container modal-small">
      <div class="modal-header">
        <i class="bi bi-box-arrow-right"></i>
        <h3>Cerrar Sesión</h3>
        <button class="modal-close" data-modal-close>
          <i class="bi bi-x-lg"></i>
        </button>
      </div>
      <div class="modal-body">
        <p>¿Estás seguro que deseas cerrar sesión?</p>
        <p style="font-size: 13px; color: #888;">Tendrás que volver a iniciar sesión para acceder al sistema.</p>
      </div>
      <div class="modal-footer">
        <button class="btn-modal-secondary" data-modal-close>Cancelar</button>
        <button id="boton_cerrar_sesion" class="btn-modal-danger">
          <i class="bi bi-box-arrow-right"></i> Cerrar Sesión
        </button>
      </div>
    </div>
  </div>
  <script src="../assets/js/modal-handler.js"></script>
  <script src="../assets/js/global-modals.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/especialidades.js?v=20251117.1"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/load-sidebar.js"></script>
</body>

</html>
