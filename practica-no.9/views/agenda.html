<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Agenda</title>
  <link rel="stylesheet" href="../assets/css/styles.css">

  <!-- guardar este boostrap para el calendario-->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      padding: 20px
    }
  </style>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../assets/css/sidebar-modern.css">
</head>

<body>
  <div class="top-bar">
    La vida es la Prioridad ante todo
  </div>
  <div id="aplicacion">
    <!-- Offcanvas sidebar Bootstrap -->


    <!-- Contenido principal -->
    <div class="page-content" id="contenido_pagina">
      <h1>Control de Agenda</h1>
      <p>Calendario y citas programadas.</p>

      <!-- Botón para agregar nueva cita -->
      <div class="mb-3">
        <button id="btn_nueva_cita" class="btn-admin">+ Nueva Cita</button>
      </div>

      <div id="calendar-root" class="card" style="width:100%; max-width:1000px;">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
              <button id="cal_prev" class="btn btn-outline-primary btn-sm">Anterior</button>
              <button id="cal_next" class="btn btn-outline-primary btn-sm">Siguiente</button>
            </div>
            <h5 id="cal_title" class="mb-0">Mes Año</h5>
            <div>
              <!-- Botón seed removido -->
            </div>
          </div>
          <div id="cal_grid" style="min-height:300px;"></div>
        </div>
      </div>

    </div>
  </div>

  <!-- Modal para Crear/Editar Cita -->
  <div id="modal_cita" class="modal-modern">
    <div class="modal-overlay"></div>
    <div class="modal-container modal-large">
      <div class="modal-header">
        <i class="bi bi-calendar-event"></i>
        <h3 id="titulo_modal_cita">Nueva Cita</h3>
        <button class="modal-close" data-modal-close>
          <i class="bi bi-x-lg"></i>
        </button>
      </div>
      <div class="modal-body">
        <form id="formulario_cita">
          <input type="hidden" id="cita_id" name="cita_id">
          <input type="hidden" name="accion" id="accion_cita" value="crear">

          <div class="row">
            <div class="col-md-6">
              <label class="form-label">Paciente *</label>
              <select class="form-control" id="cita_paciente" name="paciente_id" required>
                <option value="">Cargando...</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label">Médico *</label>
              <select class="form-control" id="cita_medico" name="medico_id" required>
                <option value="">Cargando...</option>
              </select>
            </div>
          </div>

          <div class="row mt-2">
            <div class="col-md-6">
              <label class="form-label">Fecha *</label>
              <input class="form-control" type="date" id="cita_fecha" name="fecha" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Hora *</label>
              <input class="form-control" type="time" id="cita_hora" name="hora" required>
            </div>
          </div>

          <div class="row mt-2">
            <div class="col-md-6">
              <label class="form-label">Motivo</label>
              <input class="form-control" type="text" id="cita_motivo" name="motivo">
            </div>
            <div class="col-md-6">
              <label class="form-label">Estado</label>
              <select class="form-control" id="cita_estado" name="estado">
                <option value="programada">Programada</option>
                <option value="confirmada">Confirmada</option>
                <option value="realizada">Realizada</option>
                <option value="cancelada">Cancelada</option>
                <option value="no_asistio">No Asistió</option>
              </select>
            </div>
          </div>

          <div class="row mt-2">
            <div class="col-12">
              <label class="form-label">Notas</label>
              <textarea class="form-control" id="cita_notas" name="notas" rows="3"></textarea>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-modal-secondary" data-modal-close>Cancelar</button>
        <button type="submit" form="formulario_cita" class="btn-modal-primary">
          <i class="bi bi-save"></i> Guardar Cita
        </button>
      </div>
    </div>
  </div>

  <!-- Modal Confirmación Cerrar Sesión -->
  <div id="modal_logout" class="modal-modern">
    <div class="modal-overlay"></div>
    <div class="modal-container modal-small">
      <div class="modal-header">
        <i class="bi bi-box-arrow-right"></i>
        <h3>Cerrar Sesión</h3>
        <button class="modal-close" data-modal-close>
          <i class="bi bi-x-lg"></i>
        </button>
      </div>
      <div class="modal-body">
        <p>¿Estás seguro que deseas cerrar sesión?</p>
        <p style="font-size: 13px; color: #888;">Tendrás que volver a iniciar sesión para acceder al sistema.</p>
      </div>
      <div class="modal-footer">
        <button class="btn-modal-secondary" data-modal-close>Cancelar</button>
        <button id="boton_cerrar_sesion" class="btn-modal-danger">
          <i class="bi bi-box-arrow-right"></i> Cerrar Sesión
        </button>
      </div>
    </div>
  </div>
  <script src="../assets/js/modal-handler.js"></script>
  <script src="../assets/js/global-modals.js"></script>
  <script src="../assets/js/modal-utils.js"></script>
  <script src="../assets/js/agenda.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <!-- sidebar.js eliminado, usamos offcanvas de Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/load-sidebar.js"></script>
</body>

</html>
