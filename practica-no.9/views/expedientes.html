<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expediente Médico</title>
  <link rel="stylesheet" href="../assets/css/styles.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../assets/css/sidebar-modern.css">
</head>

<body>
  <div class="top-bar">
    La vida es la Prioridad ante todo
  </div>
  <div id="aplicacion">

    <!-- Contenido principal -->
    <div class="page-content" id="contenido_pagina">
      <div class="container-fluid px-4 mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <div>
            <h1>Expediente Médico</h1>
            <p class="text-muted">Consulta y gestión de historiales clínicos</p>
          </div>
        </div>

        <div class="card p-4 mb-4">
          <div class="row g-3 align-items-end">
            <div class="col-md-8">
              <label class="form-label">Buscar Paciente</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-search"></i></span>
                <input type="text" id="buscar_expediente" class="form-control"
                  placeholder="Ingrese ID o nombre del paciente...">
                <button class="btn btn-primary" type="button" id="btn_buscar">Buscar</button>
              </div>
            </div>
          </div>
        </div>

        <div id="resultado_expediente" class="row g-3">
          <!-- Aquí se cargarán los resultados -->
          <div class="col-12 text-center py-5 text-muted">
            <i class="bi bi-search display-1"></i>
            <p class="mt-3">Ingrese un término de búsqueda para ver expedientes</p>
          </div>
        </div>
      </div>

    </div><!-- /page-content -->
  </div><!-- /aplicacion -->

  <!-- Modal Confirmación Cerrar Sesión -->
  <div id="modal_logout" class="modal-modern">
    <div class="modal-overlay"></div>
    <div class="modal-container modal-small">
      <div class="modal-header">
        <i class="bi bi-box-arrow-right"></i>
        <h3>Cerrar Sesión</h3>
        <button class="modal-close" data-modal-close>
          <i class="bi bi-x-lg"></i>
        </button>
      </div>
      <div class="modal-body">
        <p>¿Estás seguro que deseas cerrar sesión?</p>
        <p style="font-size: 13px; color: #888;">Tendrás que volver a iniciar sesión para acceder al sistema.</p>
      </div>
      <div class="modal-footer">
        <button class="btn-modal-secondary" data-modal-close>Cancelar</button>
        <button id="boton_cerrar_sesion" class="btn-modal-danger">
          <i class="bi bi-box-arrow-right"></i> Cerrar Sesión
        </button>
      </div>
    </div>
  </div>

  <script src="../assets/js/modal-handler.js"></script>
  <script src="../assets/js/global-modals.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/load-sidebar.js"></script>
  <script src="../assets/js/expedientes.js"></script>
<script src="../assets/js/auth-guard.js"></script>
</body>

</html>
